<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Survei Event Jalan</title>
<style>
:root{--bg:#eef3f2;--c:#fff;--t:#14211f;--m:#5b6b68;--p:#0f766e;--pt:#fff;--a:#b45309;--at:#fff;--b:#d3dedb;--hh:calc(54px + env(safe-area-inset-top))}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--c:#17211f;--t:#e6efed;--m:#93a5a1;--p:#2dd4bf;--pt:#04201c;--a:#fbbf24;--at:#231600;--b:#2a3a36}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100dvh}
header{position:sticky;top:0;z-index:5;background:#0f766e;color:#fff;height:var(--hh);padding:env(safe-area-inset-top) 14px 0;display:flex;align-items:center;justify-content:space-between}
header b{font-size:17px}header small{opacity:.85}header button{background:#ffffff26;color:#fff;padding:6px 10px;min-height:0;font-size:13px}
main{max-width:560px;margin:auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:10px 0 8px;color:var(--m);font-size:12px}nav a.on{color:var(--p);font-weight:700}nav a i{display:block;font-style:normal;font-size:20px}
input,select{width:100%;font:inherit;color:inherit;padding:12px;border:1px solid var(--b);border-radius:10px;background:var(--c);margin:4px 0 10px}
label{font-size:13px;color:var(--m)}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;min-height:50px;background:var(--p);color:var(--pt);font-weight:700}
button.s{background:transparent;color:var(--p);border:1.5px solid var(--p)}button.d{background:#b91c1c;color:#fff}button.big{width:100%;margin-bottom:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px}.row>*{flex:1}.m{color:var(--m);font-size:13px}h3{margin:14px 2px 6px;font-size:13px;letter-spacing:.06em;color:var(--m)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--p);color:var(--pt)}.tag.o{background:var(--a);color:var(--at)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev{position:relative;min-height:84px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:10px 12px}
.ev b{font-size:22px}.ev span{font-size:12px;font-weight:500;line-height:1.2;opacity:.95}.ev.B{background:var(--a);color:var(--at)}.ev:active{transform:scale(.97);filter:brightness(1.15)}
.ev i{position:absolute;right:10px;top:6px;font-style:normal;font-size:13px;background:#0003;border-radius:99px;padding:0 8px;min-width:22px;text-align:center}.ev i:empty{display:none}
#top{position:sticky;top:var(--hh);z-index:4;text-align:center;box-shadow:0 4px 10px #0002}#sta{font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chips button{min-height:42px;padding:8px 14px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--b);text-align:left}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111c;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;display:none;max-width:90%}
#mod{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:flex-end}#mod>div{background:var(--c);width:100%;max-width:560px;margin:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.login{max-width:380px;margin:auto;padding:calc(30px + env(safe-area-inset-top)) 20px}.login h1{margin:0 0 4px}.cr{text-align:center;color:var(--m);font-size:12px;margin-top:18px}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
</style></head><body>
<div id="app"></div><div id="toast"></div><div id="mod"><div id="mc"></div></div>
<script src="xlsx.mini.min.js"></script>
<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EV={MK:['Marka Kejut','A'],GG:['Gorong-gorong','A'],PT:['Polisi Tidur','A'],LP:['Lintasan Pipa / Galian Pipa','A'],KJ:['Kerusakan (Lubang/Patching/Amblas/Alur)','A'],BO:['Batas Overlay','A'],BTN:['Jalan Beton','A'],LNG:['Longsoran','A'],B:['Berhenti / Macet / Underspeed','B'],P:['Pasar / Pekerjaan Jalan / Pawai / Blokir','B'],TL:['Lampu Lalu Lintas','B'],S:['Simpang','B']};
const SUB={S:['3','4','5','6','7'],KJ:['Lubang','Patching','Amblas','Alur']};
// ---- database (IndexedDB) ----
const DB=new Promise((ok,no)=>{const q=indexedDB.open('eventjalan',1);q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('users',{keyPath:'u'});d.createObjectStore('ruas',{keyPath:'k'});d.createObjectStore('sesi',{keyPath:'id'});d.createObjectStore('ev',{keyPath:'id'}).createIndex('sesi','sesi')};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const run=async(st,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(st,m),r=f(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
const db={get:(s,k)=>run(s,'readonly',o=>o.get(k)),all:s=>run(s,'readonly',o=>o.getAll()),put:(s,v)=>run(s,'readwrite',o=>o.put(v)),del:(s,k)=>run(s,'readwrite',o=>o.delete(k))};
const sesiEv=id=>run('ev','readonly',o=>o.index('sesi').getAll(id));
// ---- util ----
const fmt=m=>{m=Math.round(m);const s=m<0?'-':'';m=Math.abs(m);return s+Math.floor(m/1000)+'+'+String(m%1000).padStart(3,'0')};
const parse=s=>{s=String(s).trim().replace(',','.');if(/^\d+\s*\+\s*\d+(\.\d+)?$/.test(s)){const[a,b]=s.split('+');return a*1000+ +b}return /^\d+(\.\d+)?$/.test(s)?+s:NaN};
const hav=(a,b)=>{const r=Math.PI/180,x=(b.latitude-a.latitude)*r,y=(b.longitude-a.longitude)*r,h=Math.sin(x/2)**2+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(h))};
const dt=t=>{const d=new Date(t-new Date().getTimezoneOffset()*6e4).toISOString();return[d.slice(0,10),d.slice(11,19)]};
let tT;const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tT);tT=setTimeout(()=>e.style.display='none',2200)};
const modal=h=>{$('#mc').innerHTML=h;$('#mod').style.display='flex'},closeM=()=>$('#mod').style.display='none';
const hash=async(p,s)=>{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return[...new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:100000,hash:'SHA-256'},k,256))].map(x=>x.toString(16).padStart(2,'0')).join('')};
// ---- state ----
let U=localStorage.u||'',V='ruas',R=null,SS=null,subFor=null,subT,reg=false,openS=null,F='',wl=null;const geo={w:null};
const clean=s=>String(s).replace(/[^A-Za-z0-9 ./_-]/g,'').trim().toUpperCase();
// ---- GPS & survei ----
const Lr=s=>Math.abs(s.akhir-s.awal),staAt=f=>{const a=SS.lajur=='normal'?SS.awal:SS.akhir,b=SS.lajur=='normal'?SS.akhir:SS.awal;return a+(b-a)*f};
function gpsOn(){if(geo.w!=null||!navigator.geolocation)return;geo.w=navigator.geolocation.watchPosition(p=>{const c=p.coords;geo.acc=c.accuracy;geo.lat=c.latitude;geo.lon=c.longitude;geo.err=null;if(SS&&c.accuracy<=50){if(geo.p){const d=hav(geo.p,c);if(d>=3&&d<1000)SS.d+=d}geo.p={latitude:c.latitude,longitude:c.longitude}}},e=>geo.err=e.message,{enableHighAccuracy:true,maximumAge:0,timeout:30000});navigator.wakeLock?.request('screen').then(w=>wl=w).catch(()=>{})}
function gpsOff(){if(geo.w!=null)navigator.geolocation.clearWatch(geo.w);geo.w=null;geo.p=null;wl?.release();wl=null}
async function mulai(l){if(localStorage.aktif)return toast('Selesaikan survei yang sedang berjalan dahulu');const r=await db.get('ruas',R);SS={id:uid(),k:R,lajur:l,u:U,mulai:Date.now(),selesai:null,d:0,awal:r.awal,akhir:r.akhir,st:'berjalan',sync:0};await db.put('sesi',SS);localStorage.aktif=SS.id;V='survei';gpsOn();render()}
async function lanjut(id){SS=await db.get('sesi',id);R=SS.k;V='survei';gpsOn();render()}
async function tap(k){const e={id:uid(),sesi:SS.id,k:SS.k,lajur:SS.lajur,u:U,kode:k,t:Date.now(),d:SS.d,sta:staAt(Math.min(1,SS.d/Lr(SS))),lat:geo.lat??null,lon:geo.lon??null,sub:'',sync:0};await db.put('ev',e);await db.put('sesi',SS);navigator.vibrate?.(40);clearTimeout(subT);subFor=SUB[k]?e.id:null;if(subFor)subT=setTimeout(()=>{subFor=null;render()},9000);toast(`${k} tercatat · STA ${fmt(e.sta)}`);render()}
async function setSub(v){const e=await db.get('ev',subFor);e.sub=v;e.sync=0;await db.put('ev',e);subFor=null;toast(`${e.kode}: ${v}`);render()}
async function undo(){const ev=(await sesiEv(SS.id)).sort((a,b)=>b.t-a.t);if(!ev.length)return;if(confirm(`Hapus catatan terakhir (${ev[0].kode})?`)){await db.del('ev',ev[0].id);subFor=null;render()}}
async function selesai(){if(!confirm('Akhiri survei? STA seluruh event akan dikalibrasi ke panjang ruas.'))return;SS.selesai=Date.now();SS.st='selesai';SS.sync=0;const D=SS.d,T=SS.selesai-SS.mulai;for(const e of await sesiEv(SS.id)){let f=D>=20?e.d/D:(e.t-SS.mulai)/T;e.sta=staAt(Math.max(0,Math.min(1,f)));e.sync=0;await db.put('ev',e)}await db.put('sesi',SS);localStorage.removeItem('aktif');gpsOff();SS=null;subFor=null;V='ruasDet';render()}
setInterval(()=>{if(V=='survei'&&SS&&$('#sta')){$('#sta').textContent=fmt(staAt(Math.min(1,SS.d/Lr(SS))));$('#gps').textContent=geo.err?'GPS: '+geo.err:geo.acc?`GPS ±${Math.round(geo.acc)} m · ${(SS.d/1000).toFixed(2)} km`:'Mencari sinyal GPS…';const s=Math.floor((Date.now()-SS.mulai)/1000);$('#tm').textContent=[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')}},700);
setInterval(()=>{if(SS)db.put('sesi',SS)},10000);
// ---- auth ----
async function auth(){const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;if(!u||p.length<4)return toast('Isi username dan sandi (min. 4 karakter)');if(!crypto.subtle)return toast('Perlu HTTPS untuk login');const x=await db.get('users',u);
 if(reg){if(x)return toast('Username sudah dipakai');const salt=uid();await db.put('users',{u,nama:$('#ln').value.trim()||u,salt,h:await hash(p,salt)})}else if(!x||x.h!==await hash(p,x.salt))return toast('Username atau sandi salah');
 U=u;localStorage.u=u;V='ruas';boot()}
function logout(){if(SS&&!confirm('Survei masih berjalan. Keluar tetap?'))return;gpsOff();U='';SS=null;localStorage.removeItem('u');render()}
// ---- ruas ----
function fRuas(k,r={}){modal(`<h3 style="margin:0 0 8px">${k?'Ubah':'Tambah'} Ruas</h3><label>Nomor ruas</label><input id="rk" value="${esc(k||'')}" ${k?'disabled':''} placeholder="mis. 123"><label>Nama ruas (opsional)</label><input id="rn" value="${esc(r.nama||'')}"><div class="row"><div><label>STA awal (km+m)</label><input id="ra" value="${r.awal!=null?fmt(r.awal):''}" placeholder="0+000" inputmode="text"></div><div><label>STA akhir</label><input id="rb" value="${r.akhir!=null?fmt(r.akhir):''}" placeholder="12+500"></div></div><div class="row"><button class="s" onclick="closeM()">Batal</button><button onclick="sRuas(${k?1:0})">Simpan</button></div>`)}
async function sRuas(ed){const k=clean($('#rk').value),a=parse($('#ra').value),b=parse($('#rb').value);if(!k)return toast('Nomor ruas wajib diisi');if(isNaN(a)||isNaN(b)||a===b)return toast('STA awal/akhir tidak valid (contoh 12+500)');if(!ed&&await db.get('ruas',k))return toast('Nomor ruas sudah ada');await db.put('ruas',{k,nama:$('#rn').value.trim(),awal:a,akhir:b,sync:0});closeM();R=k;V='ruasDet';render()}
async function hapusS(id){if(!confirm('Hapus survei ini beserta seluruh event-nya?'))return;for(const e of await sesiEv(id))await db.del('ev',e.id);await db.del('sesi',id);if(localStorage.aktif==id)localStorage.removeItem('aktif');render()}
// ---- views ----
const go=(v,r)=>{V=v;if(r)R=r;render()};
function vLogin(){return`<div class="login"><h1>🛣️ Survei Event Jalan</h1><p class="m">${reg?'Buat akun baru di perangkat ini':'Masuk untuk memulai survei'}</p>${reg?'<label>Nama lengkap</label><input id="ln" autocomplete="name">':''}<label>Username</label><input id="lu" autocapitalize="none" autocomplete="username"><label>Sandi</label><input id="lp" type="password" autocomplete="${reg?'new':'current'}-password" onkeydown="event.key=='Enter'&&auth()"><button class="big" onclick="auth()">${reg?'Daftar':'Masuk'}</button><button class="s big" onclick="reg=!reg;render()">${reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button><div class="cr">Created and developed by HAFM@2026</div></div>`}
async function vRuas(){const rs=(await db.all('ruas')).sort((a,b)=>a.k.localeCompare(b.k,'id',{numeric:true})),ss=await db.all('sesi');return`<button class="big" onclick="fRuas()">＋ Tambah Ruas</button>`+(rs.length?rs.map(r=>{const s=ss.filter(x=>x.k==r.k);return`<div class="card" onclick="go('ruasDet','${r.k}')"><b>Ruas ${esc(r.k)}</b> ${esc(r.nama)}<div class="m">STA ${fmt(r.awal)} → ${fmt(r.akhir)} · ${s.filter(x=>x.lajur=='normal').length} normal · ${s.filter(x=>x.lajur=='opposite').length} opposite</div></div>`}).join(''):'<p class="m" style="text-align:center;margin-top:40px">Belum ada ruas.<br>Tambahkan nomor ruas beserta STA awal dan akhir.</p>')}
async function vDet(){const r=await db.get('ruas',R),ss=(await db.all('sesi')).filter(x=>x.k==R).sort((a,b)=>b.mulai-a.mulai),ev=(await db.all('ev')).filter(x=>x.k==R);let h=`<div class="row" style="margin-bottom:8px"><button class="s" style="flex:0 0 auto" onclick="go('ruas')">← Ruas</button><button class="s" style="flex:0 0 auto" onclick='fRuas("${r.k}",${JSON.stringify({nama:r.nama,awal:r.awal,akhir:r.akhir}).replace(/'/g,"&#39;")})'>Ubah STA</button></div><div class="card"><b style="font-size:20px">Ruas ${esc(r.k)}</b> ${esc(r.nama)}<div class="m">STA ${fmt(r.awal)} → ${fmt(r.akhir)} · panjang ${(Lr(r)/1000).toFixed(2)} km</div></div><div class="row" style="margin-bottom:12px"><button onclick="mulai('normal')">▶ Normal<br><small>${fmt(r.awal)} → ${fmt(r.akhir)}</small></button><button style="background:var(--a);color:var(--at)" onclick="mulai('opposite')">◀ Opposite<br><small>${fmt(r.akhir)} → ${fmt(r.awal)}</small></button></div><h3>RIWAYAT SURVEI</h3>`;
 return h+(ss.length?ss.map(s=>{const e=ev.filter(x=>x.sesi==s.id).sort((a,b)=>a.t-b.t),[d,t]=dt(s.mulai);return`<div class="card"><span class="tag ${s.lajur=='opposite'?'o':''}">${s.lajur.toUpperCase()}</span> <b>${d} ${t.slice(0,5)}</b><div class="m">${esc(s.u)} · ${e.length} event · ${s.st}</div><div class="row" style="margin-top:8px">${s.st=='berjalan'?`<button onclick="lanjut('${s.id}')">Lanjutkan</button>`:''}<button class="s" onclick="openS=openS=='${s.id}'?null:'${s.id}';render()">${openS==s.id?'Tutup':'Lihat'}</button><button class="d" style="flex:0 0 auto" onclick="hapusS('${s.id}')">🗑</button></div>${openS==s.id?`<table style="margin-top:8px"><tr><th>STA</th><th>Event</th><th>Jam</th></tr>${e.map(x=>`<tr><td>${fmt(x.sta)}</td><td>${x.kode}${x.sub?' ('+x.sub+')':''}</td><td>${dt(x.t)[1]}</td></tr>`).join('')||'<tr><td colspan=3 class="m">Belum ada event</td></tr>'}</table>`:''}</div>`}).join(''):'<p class="m">Belum ada survei. Pilih lajur Normal atau Opposite untuk memulai.</p>')}
async function vSurvei(){const ev=await sesiEv(SS.id),c={};ev.forEach(e=>c[e.kode]=(c[e.kode]||0)+1);const se=ev.find(e=>e.id==subFor),last=[...ev].sort((a,b)=>b.t-a.t)[0],opp=SS.lajur=='opposite';
 const bt=g=>Object.entries(EV).filter(([k,v])=>v[1]==g).map(([k,v])=>`<button class="ev ${g}" onclick="tap('${k}')"><i>${c[k]||''}</i><b>${k}</b><span>${v[0]}</span></button>`).join('');
 return`<div class="card" id="top"><div class="m"><span class="tag ${opp?'o':''}">${SS.lajur.toUpperCase()} ${opp?'◀':'▶'}</span> Ruas <b>${esc(SS.k)}</b> · ${fmt(SS.awal)}→${fmt(SS.akhir)} · <span id="tm">00:00:00</span></div><div id="sta">${fmt(staAt(Math.min(1,SS.d/Lr(SS))))}</div><div class="m" id="gps">Mencari sinyal GPS…</div><div class="m">${ev.length} event${last?` · terakhir ${last.kode} @ ${fmt(last.sta)}`:''}</div></div>
 ${se?`<div class="card chips"><b>Detail ${se.kode}:</b>${SUB[se.kode].map(s=>`<button onclick="setSub('${s}')">${s}</button>`).join('')}<button class="s" onclick="subFor=null;render()">Lewati</button></div>`:''}
 <h3>EVENT A</h3><div class="grid">${bt('A')}</div><h3>EVENT B</h3><div class="grid">${bt('B')}</div><div class="row" style="margin-top:14px"><button class="s" onclick="undo()">↩ Batalkan terakhir</button><button class="d" onclick="selesai()">■ Selesai</button></div>`}
async function vData(){const [rs,ss,ev]=await Promise.all(['ruas','sesi','ev'].map(db.all)),un=ev.filter(x=>x.sync!==1).length;return`<div class="card"><b>Ringkasan</b><div class="m">${rs.length} ruas · ${ss.length} survei · ${ev.length} event · ${un} belum disinkronkan</div></div>
 <div class="card"><label>Filter ruas untuk ekspor</label><select onchange="F=this.value"><option value="">Semua ruas</option>${rs.map(r=>`<option ${F==r.k?'selected':''}>${esc(r.k)}</option>`).join('')}</select><button class="big" onclick="xport()" style="margin:0">⬇ Ekspor Excel (.xlsx)</button></div>
 <div class="card"><b>Database Google Sheet</b><div class="m">Opsional, butuh internet. Lihat petunjuk di menu Tentang.</div><label>URL Web App (Apps Script)</label><input value="${esc(localStorage.su||'')}" onchange="localStorage.su=this.value.trim()" placeholder="https://script.google.com/macros/s/.../exec"><label>Token</label><input value="${esc(localStorage.st||'')}" onchange="localStorage.st=this.value.trim()"><button class="big" style="margin:0" onclick="sync()">☁ Sinkronkan sekarang</button></div>`}
const vAbout=()=>`<div class="card"><b>Survei Event Jalan</b><p>Aplikasi pencatat event kondisi jalan saat survei lapangan. Operator cukup menekan tombol event; aplikasi mencatat posisi (STA) dan waktunya secara otomatis, bahkan tanpa internet.</p></div>
<div class="card"><b>Cara kerja</b><ol style="padding-left:20px;margin:6px 0"><li>Daftar akun, lalu masuk.</li><li>Tambah ruas: nomor ruas, STA awal dan STA akhir (sekali saja, format km+m, mis. 12+500).</li><li>Buka ruas, pilih lajur <b>Normal</b> (awal→akhir) atau <b>Opposite</b> (akhir→awal), lalu survei dimulai.</li><li>Jalankan kendaraan; saat menemui event, tekan tombolnya. Tersimpan seketika, tanpa tombol simpan. Untuk KJ dan S tersedia pilihan detail yang boleh dilewati.</li><li>STA dihitung dari jarak tempuh GPS. Saat menekan <b>Selesai</b>, seluruh STA dikalibrasi agar tepat sesuai panjang ruas.</li><li>Survei dapat diulang berkali-kali per ruas dan lajur. Ekspor ke Excel atau sinkronkan ke Google Sheet dari menu Data.</li></ol></div>
<div class="card"><b>Keterangan event</b><table>${Object.entries(EV).map(([k,v])=>`<tr><td><b>${k}</b></td><td>${v[0]}</td><td>${v[1]}</td></tr>`).join('')}</table></div>
